<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 314 286" width="100%" height="100%" fill="none">
  <defs>
    <!-- Rich metallic 24K industrial gold gradient -->
    <linearGradient id="smeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="20%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Edge highlight bevel gradient -->
    <linearGradient id="smeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.8" />
    </linearGradient>

    <!-- Crisp industrial drop shadow for high contrast on light and dark -->
    <filter id="smeCrispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#smeCrispShadow)">
    <!-- Main SME Geometric Triangle Marks -->
    <g fill="url(#smeGoldGrad)" stroke="#78350F" stroke-width="2.2" stroke-linejoin="round" stroke-miterlimit="3">
      <!-- 'S' Apex Piece -->
      <path d="M 157 7
               L 197 73
               L 165 73
               L 157 56
               L 149 73
               L 149 84
               L 204 84
               L 217 110
               L 226 125
               L 236 148
               L 78 148
               L 89 125
               L 190 125
               L 190 110
               L 99 110
               L 115 84
               L 129 55
               Z" />

      <!-- Corner Wedge (Bottom Left) -->
      <polygon points="42,212 42,277 5,277" />

      <!-- 'M' Piece (Bottom Left) -->
      <path d="M 70 160
               L 152 160
               L 152 277
               L 126 277
               L 126 188
               L 115 188
               L 115 277
               L 90 277
               L 90 188
               L 79 188
               L 79 277
               L 53 277
               L 53 188
               Z" />

      <!-- 'E' Piece (Bottom Right) -->
      <path d="M 163 160
               L 245 160
               L 261 188
               L 189 188
               L 189 204
               L 271 204
               L 284 232
               L 189 232
               L 189 252
               L 296 252
               L 310 277
               L 163 277
               Z" />
    </g>
  </g>
</svg>